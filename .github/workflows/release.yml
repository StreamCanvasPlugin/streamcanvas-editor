name: Release
run-name: ${{ github.ref_name }} release 🛫

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-ubuntu:
    name: Build (Ubuntu) 🐧
    runs-on: ubuntu-24.04
    outputs:
      commitHash: ${{ steps.setup.outputs.commitHash }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Up Environment 🔧
        id: setup
        run: echo "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

      - name: Install Dependencies 📦
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-private-dev \
            libcairo2-dev libpango1.0-dev liblua5.4-dev \
            libgl1-mesa-dev libxkbcommon-dev libxcb-cursor-dev \
            imagemagick

      - name: Build 🧱
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Package (AppImage) 📀
        run: |
          : Package (AppImage) 📀
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          DESTDIR=AppDir cmake --install build --prefix /usr

          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cat > AppDir/usr/share/applications/editor.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=OBS Graphics Editor
          Exec=editor
          Icon=editor
          Type=Application
          Categories=Graphics;AudioVideo;
          DESKTOP

          convert -size 256x256 xc:'#1a1a2e' \
            -fill '#e94560' -draw 'rectangle 64,64 192,192' \
            AppDir/usr/share/icons/hicolor/256x256/apps/editor.png

          QMAKE=$(which qmake6 2>/dev/null || which qmake) \
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

          mv OBS_Graphics_Editor*.AppImage \
            editor-${{ github.ref_name }}-linux-x86_64.AppImage

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: editor-linux-x86_64-${{ steps.setup.outputs.commitHash }}
          path: editor-${{ github.ref_name }}-linux-x86_64.AppImage

  build-macos:
    name: Build (macOS) 🍏
    runs-on: macos-15
    outputs:
      commitHash: ${{ steps.setup.outputs.commitHash }}
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Up Environment 🔧
        id: setup
        run: print "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

      - name: Install Dependencies 📦
        run: brew install cairo pango lua pkgconf ninja

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          cache: true

      - name: Build 🧱
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build build --parallel

      - name: Package (DMG) 📀
        run: |
          : Package (DMG) 📀
          if (( ${+RUNNER_DEBUG} )) setopt XTRACE

          macdeployqt build/editor.app -dmg
          mv build/editor.dmg editor-${{ github.ref_name }}-macos.dmg

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: editor-macos-${{ steps.setup.outputs.commitHash }}
          path: editor-${{ github.ref_name }}-macos.dmg

  build-windows:
    name: Build (Windows) 🪟
    runs-on: windows-2022
    outputs:
      commitHash: ${{ steps.setup.outputs.commitHash }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Up Environment 🔧
        id: setup
        run: |
          # Set Up Environment 🔧
          if ( $Env:RUNNER_DEBUG -ne $null ) { Set-PSDebug -Trace 1 }
          "commitHash=$($env:GITHUB_SHA.Substring(0,9))" >> $env:GITHUB_OUTPUT

      - name: Install pkg-config
        run: choco install pkgconfiglite -y

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-installed-x64-windows-

      - name: Configure
        run: |
          # Configure
          if ( $Env:RUNNER_DEBUG -ne $null ) { Set-PSDebug -Trace 1 }
          $vcpkgInstalled = "$PWD\build\vcpkg_installed\x64-windows"
          $env:PKG_CONFIG_PATH = "$vcpkgInstalled\lib\pkgconfig"
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DPKG_CONFIG_EXECUTABLE="$vcpkgInstalled\tools\pkgconf\pkgconf.exe"

      - name: Build 🧱
        run: cmake --build build --config Release --parallel

      - name: Package (ZIP) 📀
        run: |
          # Package (ZIP) 📀
          if ( $Env:RUNNER_DEBUG -ne $null ) { Set-PSDebug -Trace 1 }

          $stagingDir = "editor-windows-stage"
          New-Item -ItemType Directory -Path $stagingDir

          Copy-Item build\Release\editor.exe $stagingDir\
          windeployqt --release --no-translations --no-system-d3d-compiler "$stagingDir\editor.exe"

          $vcpkgBin = "build\vcpkg_installed\x64-windows\bin"
          if (Test-Path $vcpkgBin) {
            Copy-Item "$vcpkgBin\*.dll" $stagingDir\
          }

          Compress-Archive -Path $stagingDir -DestinationPath `
            "editor-${{ github.ref_name }}-windows-x64.zip"

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          name: editor-windows-x64-${{ steps.setup.outputs.commitHash }}
          path: editor-${{ github.ref_name }}-windows-x64.zip

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    needs: [build-ubuntu, build-macos, build-windows]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Download Build Artifacts 📥
        if: fromJSON(steps.check.outputs.validTag)
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s nullglob

          echo "### Checksums" > ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/*.AppImage \
                      ${{ github.workspace }}/*.dmg \
                      ${{ github.workspace }}/*.zip; do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d ' ' -f 1)" \
              >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: OBS Graphics Editor ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/*.AppImage
            ${{ github.workspace }}/*.dmg
            ${{ github.workspace }}/*.zip
