name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-ubuntu:
    name: Build (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-private-dev \
            libcairo2-dev libpango1.0-dev liblua5.4-dev

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

  build-macos:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cairo pango lua pkgconf ninja

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          cache: true

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build build --parallel

  build-windows:
    name: Build (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pkg-config
        run: choco install pkgconfiglite -y

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-installed-x64-windows-

      - name: Configure
        shell: pwsh
        run: |
          $vcpkgInstalled = "$PWD\build\vcpkg_installed\x64-windows"
          $env:PKG_CONFIG_PATH = "$vcpkgInstalled\lib\pkgconfig"
          cmake -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DPKG_CONFIG_EXECUTABLE="$vcpkgInstalled\tools\pkgconf\pkgconf.exe"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
