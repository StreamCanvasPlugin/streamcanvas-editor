version: 2.1

# Notes:
#   - Windows jobs require CircleCI's paid plan.
#   - Enable "Only build pull requests" in CircleCI project settings to replicate
#     the GH Actions behavior of building only on PRs targeting master/main.
#   - There is no path-ignore equivalent for markdown files; all pushes trigger builds.
#   - macOS build is intentionally omitted for now (x64 vs arm64 packaging TBD).

orbs:
  windows: circleci/windows@5.1.1

executors:
  linux:
    machine:
      image: ubuntu-2404:current

jobs:
  build-ubuntu:
    executor: linux
    environment:
      CCACHE_DIR: ~/.ccache
    steps:
      - checkout
      - run:
          name: Init Submodules
          command: git submodule update --init --recursive
      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              cmake ninja-build pkg-config ccache \
              qt6-base-dev qt6-base-private-dev qt6-svg-dev \
              libcairo2-dev libpango1.0-dev libminizip-dev liblua5.4-dev \
              libgl1-mesa-dev libxkbcommon-dev libxcb-cursor-dev
      - restore_cache:
          keys:
            - linux-editor-ccache-{{ .Branch }}-{{ .Revision }}
            - linux-editor-ccache-{{ .Branch }}-
            - linux-editor-ccache-
      - restore_cache:
          keys:
            - cpm-sources-v1
      - run:
          name: Build
          command: |
            CONFIG=$([ -n "$CIRCLE_TAG" ] && echo Release || echo RelWithDebInfo)
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE="$CONFIG" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCPM_SOURCE_CACHE=~/.cpm
            cmake --build build --parallel
      - save_cache:
          key: linux-editor-ccache-{{ .Branch }}-{{ .Revision }}
          paths: [~/.ccache]
          when: always
      - save_cache:
          key: cpm-sources-v1
          paths: [~/.cpm]
          when: always
      - run:
          name: Install to dist
          command: cmake --install build --prefix dist
      - store_artifacts:
          path: dist
          destination: linux-x86_64
      - run:
          name: Package (AppImage)
          command: |
            if [ -z "$CIRCLE_TAG" ]; then
              echo "Not a tag — skipping AppImage packaging"
              exit 0
            fi

            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
            wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
            chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

            # cmake install populates AppDir with binary, desktop entry, and icons
            # (CMakeLists.txt install rules handle all three for UNIX)
            DESTDIR=AppDir cmake --install build --prefix /usr

            QMAKE=$(which qmake6 2>/dev/null || which qmake) \
            ./linuxdeploy-x86_64.AppImage \
              --appdir AppDir \
              --plugin qt \
              --output appimage

            mkdir -p artifacts
            mv OBS_Graphics_Editor-x86_64.AppImage \
              "artifacts/editor-${CIRCLE_TAG}-linux-x86_64.AppImage"
  build-windows:
    executor:
      name: windows/default
      size: medium
      shell: powershell.exe
    environment:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-archives
      VCPKG_DOWNLOADS: C:\vcpkg-downloads
      SCCACHE_DIR: C:\sccache
    steps:
      - checkout
      - run:
          name: Init Submodules
          shell: bash.exe
          command: git submodule update --init --recursive
      - run:
          name: Prepare cache directories
          command: |
            New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
            New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null
            New-Item -ItemType Directory -Force -Path $env:SCCACHE_DIR | Out-Null
      - run:
          name: Install build tools
          command: choco install pkgconfiglite cmake sccache python -y --no-progress
      - restore_cache:
          keys:
            - qt-6.8.3-windows-v1
      - run:
          name: Install Qt
          command: |
            pip install aqtinstall
            if (-not (Test-Path "$env:USERPROFILE\Qt\6.8.3\msvc2022_64")) {
              aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:USERPROFILE\Qt"
            }
      - save_cache:
          key: qt-6.8.3-windows-v1
          paths:
            - ~/Qt/6.8.3/msvc2022_64
      - restore_cache:
          keys: [windows-vcpkg-tool-v1]
      - restore_cache:
          keys:
            - windows-vcpkg-archives-{{ checksum "vcpkg.json" }}-
            - windows-vcpkg-archives-
      - restore_cache:
          keys:
            - windows-vcpkg-installed-{{ checksum "vcpkg.json" }}-
      - restore_cache:
          keys:
            - windows-vcpkg-downloads-
      - restore_cache:
          keys:
            - windows-sccache-{{ .Branch }}-{{ .Revision }}
            - windows-sccache-{{ .Branch }}-
            - windows-sccache-
      - restore_cache:
          keys: [windows-cpm-sources-v1]
      - run:
          name: Bootstrap vcpkg
          command: |
            if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
              git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
              & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
            }
            & "$env:VCPKG_ROOT\vcpkg.exe" version
      - save_cache:
          key: windows-vcpkg-tool-v1
          paths: [C:\vcpkg]
      - run:
          name: Install vcpkg dependencies
          no_output_timeout: 30m
          command: |
            & "$env:VCPKG_ROOT\vcpkg.exe" install `
              --triplet x64-windows `
              --x-manifest-root="$PWD" `
              --x-install-root="$PWD\build_x64\vcpkg_installed"
      - save_cache:
          key: windows-vcpkg-archives-{{ checksum "vcpkg.json" }}-{{ epoch }}
          paths: [C:\vcpkg-archives]
          when: always
      - save_cache:
          key: windows-vcpkg-installed-{{ checksum "vcpkg.json" }}-{{ epoch }}
          paths: [build_x64/vcpkg_installed]
          when: always
      - save_cache:
          key: windows-vcpkg-downloads-{{ epoch }}
          paths: [C:\vcpkg-downloads]
          when: always
      - run:
          name: Configure
          no_output_timeout: 30m
          command: |
            $install_dir = "$PWD\build_x64\vcpkg_installed"
            $env:PKG_CONFIG_PATH = "$install_dir\x64-windows\lib\pkgconfig"
            cmake -S . -B build_x64 `
              -G "Visual Studio 17 2022" -A x64 `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
              -DVCPKG_TARGET_TRIPLET=x64-windows `
              -DVCPKG_INSTALLED_DIR="$install_dir" `
              -DVCPKG_MANIFEST_INSTALL=OFF `
              "-DCMAKE_PREFIX_PATH=$env:USERPROFILE\Qt\6.8.3\msvc2022_64" `
              -DCMAKE_C_COMPILER_LAUNCHER=sccache `
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
              "-DCPM_SOURCE_CACHE=$env:USERPROFILE\.cpm"
      - run:
          name: Build
          command: |
            $config = if ($env:CIRCLE_TAG) { "Release" } else { "RelWithDebInfo" }
            cmake --build build_x64 --config $config --parallel
      - save_cache:
          key: windows-sccache-{{ .Branch }}-{{ .Revision }}
          paths: [C:\sccache]
          when: always
      - save_cache:
          key: windows-cpm-sources-v1
          paths: [~/.cpm]
          when: always
      - run:
          name: sccache stats
          command: sccache --show-stats
          when: always
      - run:
          name: Install to dist
          command: |
            $config = if ($env:CIRCLE_TAG) { "Release" } else { "RelWithDebInfo" }
            cmake --install build_x64 --config $config --prefix dist
      - store_artifacts:
          path: dist
          destination: windows-x64
      - run:
          name: Package (ZIP)
          command: |
            if (-not $env:CIRCLE_TAG) {
              Write-Output "Not a tag — skipping ZIP packaging"
              exit 0
            }
            $config = "Release"
            $tag = $env:CIRCLE_TAG
            $stagingDir = "editor-windows-stage"
            New-Item -ItemType Directory -Path $stagingDir

            Copy-Item "build_x64\$config\obs-graphics-editor.exe" "$stagingDir\"
            & "$env:USERPROFILE\Qt\6.8.3\msvc2022_64\bin\windeployqt.exe" `
              --release --no-translations --no-system-d3d-compiler "$stagingDir\obs-graphics-editor.exe"

            $vcpkgBin = "build_x64\vcpkg_installed\x64-windows\bin"
            if (Test-Path $vcpkgBin) {
              Copy-Item "$vcpkgBin\*.dll" $stagingDir\
            }

            New-Item -ItemType Directory -Path artifacts -Force
            Compress-Archive -Path $stagingDir `
              -DestinationPath "artifacts\editor-$tag-windows-x64.zip"
      - store_artifacts:
          path: artifacts
          destination: releases

workflows:
  build:
    jobs:
      - build-ubuntu:
          filters:
            branches:
              only:
                - master
                - main
                - /release\/.*/
            tags:
              only: /.*/
      - build-windows:
          filters:
            branches:
              only:
                - master
                - main
                - /release\/.*/
            tags:
              only: /.*/
