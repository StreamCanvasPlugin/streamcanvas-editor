version: 2.1

# Notes:
#   - Windows jobs require CircleCI's paid plan.
#   - Set GITHUB_TOKEN in CircleCI project settings for the create-release job.
#   - Enable "Only build pull requests" in CircleCI project settings to replicate
#     the GH Actions behavior of building only on PRs targeting master/main.
#   - There is no path-ignore equivalent for markdown files; all pushes trigger builds.
#   - macOS build is intentionally omitted for now (x64 vs arm64 packaging TBD).

orbs:
  windows: circleci/windows@5.1.1

executors:
  linux:
    machine:
      image: ubuntu-2404:current

jobs:
  build-ubuntu:
    executor: linux
    environment:
      CCACHE_DIR: ~/.ccache
    steps:
      - checkout
      - run:
          name: Init Submodules
          command: git submodule update --init --recursive
      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              cmake ninja-build pkg-config ccache \
              qt6-base-dev qt6-base-private-dev qt6-svg-dev \
              libcairo2-dev libpango1.0-dev libminizip-dev liblua5.4-dev \
              libgl1-mesa-dev libxkbcommon-dev libxcb-cursor-dev
      - restore_cache:
          keys:
            - linux-editor-ccache-{{ .Branch }}-{{ .Revision }}
            - linux-editor-ccache-{{ .Branch }}-
            - linux-editor-ccache-
      - restore_cache:
          keys:
            - cpm-sources-v1
      - run:
          name: Build
          command: |
            CONFIG=$([ -n "$CIRCLE_TAG" ] && echo Release || echo RelWithDebInfo)
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE="$CONFIG" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCPM_SOURCE_CACHE=~/.cpm
            cmake --build build --parallel
      - save_cache:
          key: linux-editor-ccache-{{ .Branch }}-{{ .Revision }}
          paths: [~/.ccache]
          when: always
      - save_cache:
          key: cpm-sources-v1
          paths: [~/.cpm]
          when: always
      - run:
          name: Install to dist
          command: cmake --install build --prefix dist
      - store_artifacts:
          path: dist
          destination: linux-x86_64
      - run:
          name: Package (AppImage)
          command: |
            if [ -z "$CIRCLE_TAG" ]; then
              echo "Not a tag — skipping AppImage packaging"
              exit 0
            fi

            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
            wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
            chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

            # cmake install populates AppDir with binary, desktop entry, and icons
            # (CMakeLists.txt install rules handle all three for UNIX)
            DESTDIR=AppDir cmake --install build --prefix /usr

            QMAKE=$(which qmake6 2>/dev/null || which qmake) \
            ./linuxdeploy-x86_64.AppImage \
              --appdir AppDir \
              --plugin qt \
              --output appimage

            mkdir -p artifacts
            mv OBS_Graphics_Editor-x86_64.AppImage \
              "artifacts/editor-${CIRCLE_TAG}-linux-x86_64.AppImage"
      - run:
          name: Prepare Workspace
          command: mkdir -p artifacts
      - persist_to_workspace:
          root: .
          paths:
            - artifacts
      - store_artifacts:
          path: artifacts
          destination: releases

  build-windows:
    executor:
      name: windows/server-2022
    environment:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-archives
      VCPKG_DOWNLOADS: C:\vcpkg-downloads
      SCCACHE_DIR: C:\sccache
    steps:
      - checkout
      - run:
          name: Init Submodules
          command: git submodule update --init --recursive
      - run:
          name: Prepare cache directories
          command: |
            New-Item -ItemType Directory -Force C:\vcpkg-archives
            New-Item -ItemType Directory -Force C:\vcpkg-downloads
            New-Item -ItemType Directory -Force C:\sccache
      - run:
          name: Install build tools
          command: choco install pkgconfiglite cmake sccache -y --no-progress
      - restore_cache:
          keys:
            - qt-6.8.3-windows-v1
      - run:
          name: Install Qt
          command: |
            pip install aqtinstall
            if (-not (Test-Path "$env:USERPROFILE\Qt\6.8.3\msvc2022_64")) {
              aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:USERPROFILE\Qt"
            }
      - save_cache:
          key: qt-6.8.3-windows-v1
          paths:
            - ~/Qt/6.8.3/msvc2022_64
      - restore_cache:
          keys: [vcpkg-tool-v1]
      - restore_cache:
          keys:
            - editor-vcpkg-archives-{{ checksum "vcpkg.json" }}-
            - editor-vcpkg-archives-
      - restore_cache:
          keys:
            - editor-vcpkg-installed-{{ checksum "vcpkg.json" }}
      - restore_cache:
          keys:
            - editor-vcpkg-downloads-
      - restore_cache:
          keys:
            - windows-editor-sccache-{{ .Branch }}-{{ .Revision }}
            - windows-editor-sccache-{{ .Branch }}-
            - windows-editor-sccache-
      - restore_cache:
          keys: [windows-cpm-sources-v1]
      - run:
          name: Bootstrap vcpkg
          command: |
            # CircleCI's Windows image does not reliably ship vcpkg
            # (VCPKG_INSTALLATION_ROOT may be unset), so clone + bootstrap it
            # ourselves into $VCPKG_ROOT.
            if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
              git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
              & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
            }
            & "$env:VCPKG_ROOT\vcpkg.exe" version
      - save_cache:
          key: vcpkg-tool-v1
          paths: [C:\vcpkg]
      - run:
          name: Install vcpkg dependencies
          no_output_timeout: 30m
          command: |
            & "$env:VCPKG_ROOT\vcpkg.exe" install `
              --triplet x64-windows `
              --x-manifest-root="$PWD" `
              --x-install-root="$PWD\build\vcpkg_installed"
      - save_cache:
          key: editor-vcpkg-archives-{{ checksum "vcpkg.json" }}-{{ epoch }}
          paths: [C:\vcpkg-archives]
          when: always
      - save_cache:
          key: editor-vcpkg-installed-{{ checksum "vcpkg.json" }}
          paths: [build/vcpkg_installed]
          when: always
      - save_cache:
          key: editor-vcpkg-downloads-{{ epoch }}
          paths: [C:\vcpkg-downloads]
          when: always
      - run:
          name: Configure
          command: |
            $vcpkgInstalled = "$PWD\build\vcpkg_installed\x64-windows"
            $env:PKG_CONFIG_PATH = "$vcpkgInstalled\lib\pkgconfig"
            $env:Qt6_DIR = "$env:USERPROFILE\Qt\6.8.3\msvc2022_64\lib\cmake\Qt6"
            cmake -B build `
              -G "Visual Studio 17 2022" -A x64 `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
              -DVCPKG_TARGET_TRIPLET=x64-windows `
              -DVCPKG_INSTALLED_DIR="$PWD\build\vcpkg_installed" `
              -DVCPKG_MANIFEST_INSTALL=OFF `
              "-DCMAKE_C_COMPILER_LAUNCHER=sccache" `
              "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache" `
              "-DCPM_SOURCE_CACHE=$env:USERPROFILE\.cpm"
      - run:
          name: Build
          command: |
            $config = if ($env:CIRCLE_TAG) { "Release" } else { "RelWithDebInfo" }
            cmake --build build --config $config --parallel
      - save_cache:
          key: windows-editor-sccache-{{ .Branch }}-{{ .Revision }}
          paths: [C:\sccache]
          when: always
      - save_cache:
          key: windows-cpm-sources-v1
          paths: [~/.cpm]
          when: always
      - run:
          name: Install to dist
          command: |
            $config = if ($env:CIRCLE_TAG) { "Release" } else { "RelWithDebInfo" }
            cmake --install build --config $config --prefix dist
      - store_artifacts:
          path: dist
          destination: windows-x64
      - run:
          name: Package (ZIP)
          command: |
            if (-not $env:CIRCLE_TAG) {
              Write-Output "Not a tag — skipping ZIP packaging"
              exit 0
            }
            $config = "Release"
            $tag = $env:CIRCLE_TAG
            $stagingDir = "editor-windows-stage"
            New-Item -ItemType Directory -Path $stagingDir

            Copy-Item "build\$config\obs-graphics-editor.exe" "$stagingDir\"
            & "$env:USERPROFILE\Qt\6.8.3\msvc2022_64\bin\windeployqt.exe" `
              --release --no-translations --no-system-d3d-compiler "$stagingDir\obs-graphics-editor.exe"

            $vcpkgBin = "build\vcpkg_installed\x64-windows\bin"
            if (Test-Path $vcpkgBin) {
              Copy-Item "$vcpkgBin\*.dll" $stagingDir\
            }

            New-Item -ItemType Directory -Path artifacts -Force
            Compress-Archive -Path $stagingDir `
              -DestinationPath "artifacts\editor-$tag-windows-x64.zip"
      - run:
          name: Prepare Workspace
          command: New-Item -ItemType Directory -Path artifacts -Force
      - persist_to_workspace:
          root: .
          paths:
            - artifacts
      - store_artifacts:
          path: artifacts
          destination: releases

  create-release:
    executor: linux
    steps:
      - attach_workspace:
          at: ~/workspace
      - run:
          name: Install GitHub CLI
          command: |
            type gh >/dev/null 2>&1 || {
              sudo apt-get update -qq && sudo apt-get install -y gh
            }
      - run:
          name: Validate Tag
          command: |
            if ! echo "$CIRCLE_TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-beta[0-9]*|-rc[0-9]*)?$'; then
              echo "Tag '$CIRCLE_TAG' does not match a release version format — skipping"
              circleci-agent step halt
            fi
      - run:
          name: Generate Checksums
          command: |
            echo "### Checksums" > CHECKSUMS.txt
            shopt -s nullglob
            for file in ~/workspace/artifacts/*.AppImage \
                        ~/workspace/artifacts/*.zip; do
              echo "    ${file##*/}: $(sha256sum "$file" | cut -d ' ' -f 1)" >> CHECKSUMS.txt
            done
            cat CHECKSUMS.txt
      - run:
          name: Create GitHub Release
          command: |
            PRERELEASE_FLAG=""
            if echo "$CIRCLE_TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-(beta|rc)'; then
              PRERELEASE_FLAG="--prerelease"
            fi
            shopt -s nullglob
            ARTIFACTS=(
              ~/workspace/artifacts/*.AppImage
              ~/workspace/artifacts/*.zip
            )
            gh release create "$CIRCLE_TAG" \
              --repo "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
              --title "OBS Graphics Editor $CIRCLE_TAG" \
              --notes-file CHECKSUMS.txt \
              --draft \
              $PRERELEASE_FLAG \
              "${ARTIFACTS[@]}"

workflows:
  build:
    jobs:
      - build-ubuntu:
          filters:
            branches:
              only:
                - master
                - main
                - /release\/.*/
            tags:
              only: /.*/
      - build-windows:
          filters:
            branches:
              only:
                - master
                - main
                - /release\/.*/
            tags:
              only: /.*/
      - create-release:
          requires:
            - build-ubuntu
            - build-windows
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /[0-9]+\.[0-9]+\.[0-9]+.*/
