version: 2.1

# Notes:
#   - Windows jobs require CircleCI's paid plan.
#   - Enable "Only build pull requests" in CircleCI project settings to replicate
#     the GH Actions behavior of building only on PRs targeting master/main.
#   - There is no path-ignore equivalent for markdown files; all pushes trigger builds.
#   - macOS build is intentionally omitted for now (x64 vs arm64 packaging TBD).

orbs:
  windows: circleci/windows@5.1.1

executors:
  linux:
    machine:
      image: ubuntu-2404:current

commands:
  upload_to_minio:
    parameters:
      component:
        type: string
      linux_ext:
        type: string
        default: tar.gz
      windows_ext:
        type: string
        default: zip
      shell:
        type: enum
        enum: [bash, powershell]
        default: bash
    steps:
      - when:
          condition:
            equal: [bash, << parameters.shell >>]
          steps:
            - run:
                name: Upload << parameters.component >> (linux) to MinIO
                command: |
                  if [ -z "$CIRCLE_TAG" ]; then echo "Not a tag — skipping"; exit 0; fi
                  curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
                  unzip -q /tmp/awscliv2.zip -d /tmp
                  sudo /tmp/aws/install --update
                  export AWS_ACCESS_KEY_ID="$MINIO_ACCESS_KEY_ID"
                  export AWS_SECRET_ACCESS_KEY="$MINIO_SECRET_ACCESS_KEY"
                  export COMP="<< parameters.component >>"
                  export EXT="<< parameters.linux_ext >>"
                  export WEXT="<< parameters.windows_ext >>"
                  TAG="$CIRCLE_TAG"
                  FILE="artifacts/${COMP}-${TAG}-linux-x86_64.${EXT}"
                  aws s3 cp "$FILE" \
                    "s3://releases/${COMP}/${COMP}-${TAG}-linux-x86_64.${EXT}" \
                    --endpoint-url "$MINIO_S3_ENDPOINT" --region us-east-1
                  aws s3 cp s3://releases/manifest.json /tmp/manifest.json \
                    --endpoint-url "$MINIO_S3_ENDPOINT" --region us-east-1 2>/dev/null \
                    || echo '{}' > /tmp/manifest.json
                  python3 \<< 'PYEOF'
                  import json, os
                  tag  = os.environ['CIRCLE_TAG']
                  comp = os.environ['COMP']
                  ext  = os.environ['EXT']
                  wext = os.environ['WEXT']
                  try:
                      with open('/tmp/manifest.json') as f:
                          m = json.load(f)
                  except Exception:
                      m = {}
                  m[comp] = {
                      'linux_x86_64': f'{comp}-{tag}-linux-x86_64.{ext}',
                      'windows_x64':  f'{comp}-{tag}-windows-x64.{wext}',
                  }
                  with open('/tmp/manifest.json', 'w') as f:
                      json.dump(m, f, indent=2)
                  PYEOF
                  aws s3 cp /tmp/manifest.json s3://releases/manifest.json \
                    --endpoint-url "$MINIO_S3_ENDPOINT" --region us-east-1 \
                    --content-type application/json
      - when:
          condition:
            equal: [powershell, << parameters.shell >>]
          steps:
            - run:
                name: Upload << parameters.component >> (windows) to MinIO
                shell: powershell.exe
                command: |
                  if (-not $env:CIRCLE_TAG) { Write-Output "Not a tag — skipping"; exit 0 }
                  $tag  = $env:CIRCLE_TAG
                  $comp = '<< parameters.component >>'
                  $ext  = '<< parameters.windows_ext >>'
                  $env:AWS_ACCESS_KEY_ID     = $env:MINIO_ACCESS_KEY_ID
                  $env:AWS_SECRET_ACCESS_KEY = $env:MINIO_SECRET_ACCESS_KEY

                  $file = "artifacts\$comp-$tag-windows-x64.$ext"
                  aws s3 cp $file `
                    "s3://releases/$comp/$comp-$tag-windows-x64.$ext" `
                    --endpoint-url $env:MINIO_S3_ENDPOINT --region us-east-1

                  try {
                    aws s3 cp s3://releases/manifest.json "$env:TEMP\manifest.json" `
                      --endpoint-url $env:MINIO_S3_ENDPOINT --region us-east-1 2>$null
                  } catch {}
                  if (-not (Test-Path "$env:TEMP\manifest.json")) {
                    '{}' | Set-Content "$env:TEMP\manifest.json"
                  }

                  $linExt = '<< parameters.linux_ext >>'
                  $m = Get-Content "$env:TEMP\manifest.json" | ConvertFrom-Json
                  $m | Add-Member -NotePropertyName $comp -NotePropertyValue ([PSCustomObject]@{
                    linux_x86_64 = "$comp-$tag-linux-x86_64.$linExt"
                    windows_x64  = "$comp-$tag-windows-x64.$ext"
                  }) -Force
                  $m | ConvertTo-Json -Depth 5 | Set-Content "$env:TEMP\manifest_new.json"

                  aws s3 cp "$env:TEMP\manifest_new.json" s3://releases/manifest.json `
                    --endpoint-url $env:MINIO_S3_ENDPOINT --region us-east-1 `
                    --content-type application/json

jobs:
  build-ubuntu:
    executor: linux
    environment:
      CCACHE_DIR: ~/.ccache
    steps:
      - checkout
      - run:
          name: Init Submodules
          command: git submodule update --init --recursive
      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              cmake ninja-build pkg-config ccache \
              qt6-base-dev qt6-base-private-dev qt6-svg-dev \
              libcairo2-dev libpango1.0-dev libminizip-dev \
              libgl1-mesa-dev libxkbcommon-dev libxcb-cursor-dev
      - restore_cache:
          keys:
            - linux-editor-ccache-{{ .Branch }}-{{ .Revision }}
            - linux-editor-ccache-{{ .Branch }}-
            - linux-editor-ccache-
      - restore_cache:
          keys:
            - cpm-sources-v1
      - run:
          name: Build
          command: |
            CONFIG=$([ -n "$CIRCLE_TAG" ] && echo Release || echo RelWithDebInfo)
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE="$CONFIG" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCPM_SOURCE_CACHE=~/.cpm
            cmake --build build --parallel
      - save_cache:
          key: linux-editor-ccache-{{ .Branch }}-{{ .Revision }}
          paths: [~/.ccache]
          when: always
      - save_cache:
          key: cpm-sources-v1
          paths: [~/.cpm]
          when: always
      - run:
          name: Install to dist
          command: cmake --install build --prefix dist
      - store_artifacts:
          path: dist
          destination: linux-x86_64
      - run:
          name: Package (AppImage)
          command: |
            if [ -z "$CIRCLE_TAG" ]; then
              echo "Not a tag — skipping AppImage packaging"
              exit 0
            fi

            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
            wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
            chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

            DESTDIR=AppDir cmake --install build --prefix /usr

            QMAKE=$(which qmake6 2>/dev/null || which qmake) \
            ./linuxdeploy-x86_64.AppImage \
              --appdir AppDir \
              --plugin qt \
              --output appimage

            mkdir -p artifacts
            mv StreamCanvas_Editor-x86_64.AppImage \
              "artifacts/editor-${CIRCLE_TAG}-linux-x86_64.AppImage"
      - store_artifacts:
          path: artifacts
          destination: releases
      - upload_to_minio:
          component: editor
          linux_ext: AppImage

  build-windows:
    executor:
      name: windows/default
      size: medium
      shell: powershell.exe
    environment:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-archives
      VCPKG_DOWNLOADS: C:\vcpkg-downloads
      SCCACHE_DIR: C:\sccache
    steps:
      - checkout
      - run:
          name: Init Submodules
          shell: bash.exe
          command: git submodule update --init --recursive
      - run:
          name: Prepare cache directories
          command: |
            New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
            New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null
            New-Item -ItemType Directory -Force -Path $env:SCCACHE_DIR | Out-Null
      - run:
          name: Install build tools
          command: choco install pkgconfiglite cmake sccache python awscli -y --no-progress
      - restore_cache:
          keys:
            - qt-6.8.3-windows-v1
      - run:
          name: Install Qt
          command: |
            pip install aqtinstall
            if (-not (Test-Path "$env:USERPROFILE\Qt\6.8.3\msvc2022_64")) {
              aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:USERPROFILE\Qt"
            }
      - save_cache:
          key: qt-6.8.3-windows-v1
          paths:
            - ~/Qt/6.8.3/msvc2022_64
      - restore_cache:
          keys: [windows-vcpkg-tool-v1]
      - restore_cache:
          keys:
            - windows-vcpkg-archives-{{ checksum "vcpkg.json" }}-
            - windows-vcpkg-archives-
      - restore_cache:
          keys:
            - windows-vcpkg-installed-{{ checksum "vcpkg.json" }}-
      - restore_cache:
          keys:
            - windows-vcpkg-downloads-
      - restore_cache:
          keys:
            - windows-sccache-{{ .Branch }}-{{ .Revision }}
            - windows-sccache-{{ .Branch }}-
            - windows-sccache-
      - restore_cache:
          keys: [windows-cpm-sources-v1]
      - run:
          name: Bootstrap vcpkg
          command: |
            if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
              git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
              & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
            }
            & "$env:VCPKG_ROOT\vcpkg.exe" version
      - save_cache:
          key: windows-vcpkg-tool-v1
          paths: [C:\vcpkg]
      - run:
          name: Install vcpkg dependencies
          no_output_timeout: 30m
          command: |
            & "$env:VCPKG_ROOT\vcpkg.exe" install `
              --triplet x64-windows `
              --x-manifest-root="$PWD" `
              --x-install-root="$PWD\build_x64\vcpkg_installed"
      - save_cache:
          key: windows-vcpkg-archives-{{ checksum "vcpkg.json" }}-{{ epoch }}
          paths: [C:\vcpkg-archives]
          when: always
      - save_cache:
          key: windows-vcpkg-installed-{{ checksum "vcpkg.json" }}-{{ epoch }}
          paths: [build_x64/vcpkg_installed]
          when: always
      - save_cache:
          key: windows-vcpkg-downloads-{{ epoch }}
          paths: [C:\vcpkg-downloads]
          when: always
      - run:
          name: Configure
          no_output_timeout: 30m
          command: |
            $install_dir = "$PWD\build_x64\vcpkg_installed"
            $env:PKG_CONFIG_PATH = "$install_dir\x64-windows\lib\pkgconfig"
            cmake -S . -B build_x64 `
              -G "Visual Studio 17 2022" -A x64 `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
              -DVCPKG_TARGET_TRIPLET=x64-windows `
              -DVCPKG_INSTALLED_DIR="$install_dir" `
              -DVCPKG_MANIFEST_INSTALL=OFF `
              "-DCMAKE_PREFIX_PATH=$env:USERPROFILE\Qt\6.8.3\msvc2022_64" `
              -DCMAKE_C_COMPILER_LAUNCHER=sccache `
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
              "-DCPM_SOURCE_CACHE=$env:USERPROFILE\.cpm"
      - run:
          name: Build
          command: |
            $config = if ($env:CIRCLE_TAG) { "Release" } else { "RelWithDebInfo" }
            cmake --build build_x64 --config $config --parallel
      - save_cache:
          key: windows-sccache-{{ .Branch }}-{{ .Revision }}
          paths: [C:\sccache]
          when: always
      - save_cache:
          key: windows-cpm-sources-v1
          paths: [~/.cpm]
          when: always
      - run:
          name: sccache stats
          command: sccache --show-stats
          when: always
      - run:
          name: Install to dist
          command: |
            $config = if ($env:CIRCLE_TAG) { "Release" } else { "RelWithDebInfo" }
            cmake --install build_x64 --config $config --prefix dist
      - store_artifacts:
          path: dist
          destination: windows-x64
      - run:
          name: Package (ZIP)
          command: |
            if (-not $env:CIRCLE_TAG) {
              Write-Output "Not a tag — skipping ZIP packaging"
              exit 0
            }
            $config = "Release"
            $tag = $env:CIRCLE_TAG
            $stagingDir = "editor-windows-stage"
            New-Item -ItemType Directory -Path $stagingDir

            Copy-Item "build_x64\$config\stream-canvas-editor.exe" "$stagingDir\"
            & "$env:USERPROFILE\Qt\6.8.3\msvc2022_64\bin\windeployqt.exe" `
              --release --no-translations --no-system-d3d-compiler "$stagingDir\stream-canvas-editor.exe"

            $vcpkgBin = "build_x64\vcpkg_installed\x64-windows\bin"
            if (Test-Path $vcpkgBin) {
              Copy-Item "$vcpkgBin\*.dll" $stagingDir\
            }

            New-Item -ItemType Directory -Path artifacts -Force
            Compress-Archive -Path $stagingDir `
              -DestinationPath "artifacts\editor-$tag-windows-x64.zip"
      - store_artifacts:
          path: artifacts
          destination: releases
      - upload_to_minio:
          component: editor
          linux_ext: AppImage
          shell: powershell

workflows:
  build:
    jobs:
      - build-ubuntu:
          filters:
            branches:
              only:
                - master
                - main
                - /release\/.*/
            tags:
              only: /.*/
      - build-windows:
          filters:
            branches:
              only:
                - master
                - main
                - /release\/.*/
            tags:
              only: /.*/
